upstream user_service {
    server user-service:8000;
}

upstream training_service {
    server training-service:8000;
}

upstream model_zoo_service {
    server model-zoo-service:8000;
}

upstream app_store_service {
    server app-store-service:8000;
}

upstream deployment_service {
    server deployment-service:8000;
}

upstream toolbox_service {
    server toolbox-service:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    location /api/v1/auth/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/training/ {
        proxy_pass http://training_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/models {
        proxy_pass http://model_zoo_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
    }

    location /api/v1/apps {
        proxy_pass http://app_store_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 100M;
    }

    location /api/v1/deployments {
        proxy_pass http://deployment_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /api/v1/toolbox/ {
        proxy_pass http://toolbox_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health/users {
        proxy_pass http://user_service/health;
    }

    location /health/training {
        proxy_pass http://training_service/health;
    }

    location /health/models {
        proxy_pass http://model_zoo_service/health;
    }

    location /health/apps {
        proxy_pass http://app_store_service/health;
    }

    location /health/deployments {
        proxy_pass http://deployment_service/health;
    }

    location /health/toolbox {
        proxy_pass http://toolbox_service/health;
    }

    location / {
        default_type application/json;
        return 200 '{"platform":"iot-ai-training","gateway":"ok","services":["auth","models","apps","deployments"]}';
    }
}
