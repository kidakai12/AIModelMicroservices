# Supabase local + full app stack (shared Postgres on host :54322)

services:
  user-service:
    build: ./services/user-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:54323}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  model-zoo-service:
    build: ./services/model-zoo-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      STORAGE_PATH: /data/models
    volumes:
      - model_zoo_data:/data/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"

  app-store-service:
    build: ./services/app-store-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      STORAGE_PATH: /data/apps
    volumes:
      - app_store_data:/data/apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8000"

  deployment-service:
    build: ./services/deployment-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      MODEL_ZOO_URL: http://model-zoo-service:8000
      APP_STORE_URL: http://app-store-service:8000
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - model-zoo-service
      - app-store-service
    ports:
      - "8003:8000"

  training-service:
    build: ./services/training-service
    expose:
      - "8000"

  toolbox-service:
    build: ./services/toolbox-service
    expose:
      - "8000"

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - model-zoo-service
      - app-store-service
      - deployment-service
      - training-service
      - toolbox-service

volumes:
  model_zoo_data:
  app_store_data:
